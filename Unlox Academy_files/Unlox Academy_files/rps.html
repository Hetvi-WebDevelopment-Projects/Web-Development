<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: linear-gradient(45deg, #ff6b6b, #f06595, #cc5de8, #845ef7);
            text-align:center;
            font-family: Arial, Helvetica, sans-serif;
            margin: 50px;
        }
        h1{
            color: beige;
        }
        .choice{
            display: flex;
            justify-content: center;
            gap: 25px;
        }
        .choice button{
            padding: 15px;
            margin: 10px;
            font-size: 20px;
            text-align: center;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        #result{
            margin-top: 20px;
            font-size: 24px;
            color: white;
            font-weight: bold;
            font-style: italic;
        }
        .scoreboard{
            background: white;
            font-size: 18px;
            margin-top: 30px;
            border-radius: 10px;
            padding: 15px;
            display: block;
            box-shadow: 0 0 15px red;
        }
        .reset{
             padding: 15px;
            margin: 10px;
            font-size: 20px;
            text-align: center;
            border: none;
            border-radius: 12px;
            cursor: pointer;

        }
    </style>
</head>
<body>
    <div class="choice">
        <button class="rock" onclick="playGame('rock')">Rock</button>
        <button class="paper" onclick="playGame('paper')">Paper</button>
        <button class="scissor" onclick="playGame('scissors')">Scissors</button>
    </div>
    <p id="result">Choose an option to Start the Game.</p>
    <div class="scoreboard">
        <p><Strong>Scoreboard</Strong></p>
        <p>Wins     : <span id="wins">0</span> </p>
        <p>Losses   : <span id="losses">0</span> </p>
        <p>Draw     : <span id="draws">0</span> </p>
    </div>
    <button class="reset" onclick="resetGame()">Restart</button>

    <script>
        let wins=0
        let losses=0
        let draws=0

        function playGame(userchoice){
            //Rock paper Scissor
            const choices =['rock','paper','scissors']
            const computerchoice= choices[Math.floor(Math.random()*3)]

            
            let resultMessage=""

            if(userchoice===computerchoice){
                resultMessage= 'You Pick the same is a draw '+userchoice
                draw++
            }
            else if((userchoice==='rock' && computerchoice ==='scissors') 
            || (userchoice==='scissors' && computerchoice ==='paper') 
            || (userchoice==='paper' && computerchoice ==='rock'))
            {
                resultMessage= 'You Won 🎉 ' + userchoice +'beats '+ computerchoice
                wins++
            }
            else {
                resultMessage = 'You Loose 😢 '+ computerchoice +' beats '+ userchoice
                losses++
            }
            document.getElementById('result').innerHTML= resultMessage
            document.getElementById('wins').innerHTML= wins
            document.getElementById('losses').innerHTML= losses
            document.getElementById('draw').innerHTML= draws
        }   
        function resetGame(){
            wins = 0
            losses = 0
            draws = 0


             document.getElementById('result').innerHTML = "Game Restarted Play Again"
            document.getElementById('wins').innerHTML = wins
            document.getElementById('losses').innerHTML = losses
            document.getElementById('draws').innerHTML = draws



        }
    </script>
</body>
</html>
