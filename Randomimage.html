<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Random Dog Image</h1>
    <button onclick="fetchDog()"></button>Get Dog Image</button>
    <br>
    <img id="dogImage" src="" height="250px" width="250px">
    <script>
        // fetch("API Address")
        function fetchDog(){
            //step 1: fetch the data from API
            fetch('https://dog.ceo/api/breeds/image/random')
            //step 2: Use .then()-Succesfull-Resolve and .catch()failed/reject
            //step 3: convert into json() - It will convert the data into json format
            .then(response => response.json())
            .then(data => {
                document.getElementById('dogImage').src = data.message
            })
            .catch(error => console.log('Error fetching dog image:', error))
            
        }
    </script>
</body>
</html>
